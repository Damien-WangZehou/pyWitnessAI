[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyWitnessAI"
description = "DeepFace-based facial recognition utilities"
# Use setuptools_scm to derive the version from Git tags; see [tool.setuptools_scm] below.
dynamic = ["version"]
requires-python = ">=3.10, <3.12"
authors = [
  { name = "Stewart Boogert", email = "sboogert@mac.com" },
  { name = "Damien Wang", email = "damien.wang@bristol.ac.uk" }
]

# Core minimal dependencies. Keep this light; heavy/fragile deps are moved to extras.
dependencies = [
    "cv",
    "deepface",
    "matplotlib",
    "ipython",
    "pandas",
    "facenet-pytorch",
    "mtcnn == 0.1.1",           # Has to be pinned for compatibility
    "tf-keras",                 # For RetinaFace from deepface module
#    "tensorflow == 2.16.1",     # Pinned for compatibility with deepface and keras
#    "keras == 3.0.5",           # Pinned for compatibility with deepface and tensorflow
#    "pillow",
#    "typing_extensions",
#    "requests",
#    "absl-py<2.0.0",
#    "gast==0.6.0",
]

[project.optional-dependencies]
cfd-pilot = [
    "sentence-transformers>=2.7",
    "torch",
    "Pillow",
    "tqdm",
    "openpyxl",
]
generation = [
    "openai>=1.0",
    "Pillow",
    "matplotlib",
]

colloff_replication = [
    "deepface==0.0.79",
    "tensorflow==2.14.0",
    "tensorflow-intel==2.14.0; platform_system == 'Windows'",
    "keras==2.14.0",
    "mtcnn==0.1.1",
    "numpy==1.26.1",
    "opencv-python==4.8.1.78",
    "pandas==2.1.2",
    "Pillow==10.1.0",
    "h5py==3.10.0",
    "protobuf==4.24.4",
    "setuptools==81.0.0",
]
notebook = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<7",
]
dev = [
    "build>=1,<2",
    "pytest>=8,<9",
]

[project.scripts]
pyWitnessAI = "pyWitnessAI:main"

[project.urls]
Homepage = "https://github.com/your-org/pyWitnessAI"
Issues = "https://github.com/your-org/pyWitnessAI/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyWitnessAI*"]

# Package data declared with paths relative to the package root (not "src/...").
[tool.setuptools.package-data]
pyWitnessAI = [
  "FaceNet_Model/FACE-DETECT.h5",
  "OpenCV_Models/*.xml"
]

# setuptools_scm: derive version from Git; fallback if no tags are available.
[tool.setuptools_scm]
fallback_version = "0.0.1"
write_to = "src/pyWitnessAI/_version.py"
