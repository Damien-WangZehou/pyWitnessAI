[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyWitnessAI"
description = "Configurable eyewitness description, filler selection, and face analysis tools"
readme = "README.md"
# Use setuptools_scm to derive the version from Git tags; see [tool.setuptools_scm] below.
dynamic = ["version"]
requires-python = ">=3.10, <3.12"
authors = [
  { name = "Stewart Boogert", email = "sboogert@mac.com" },
  { name = "Damien Wang", email = "damien.wang@bristol.ac.uk" }
]

# Core minimal dependencies. Keep this light; heavy/fragile deps are moved to extras.
dependencies = [
    "numpy",
    "pandas",
    "Pillow",
]

[project.optional-dependencies]
clip = [
    # Validated encoder compatibility; study-specific constraints live with the study.
    "sentence-transformers==2.7.0",
    "transformers==4.40.0",
    "tokenizers==0.19.1",
    "torch",
    "tqdm",
]
vision = [
    "pyWitnessAI[plot]",
    "deepface",
    "facenet-pytorch",
    "mtcnn==0.1.1",             # Retain existing detector compatibility.
    "tf-keras",
    "opencv-python",
    "tqdm",
]
plot = [
    "matplotlib",
]
excel = [
    "openpyxl",
    "xlrd",
]
generation = [
    "openai>=1.0",
]
standardization = [
    "opencv-python>=4.8,<5",
    "onnxruntime>=1.17,<2",
]
enhancement = [
    "pyWitnessAI[standardization]",
    "torch>=2.6,<3",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
]

colloff_replication = [
    "deepface==0.0.79",
    "tensorflow==2.14.0",
    "tensorflow-intel==2.14.0; platform_system == 'Windows'",
    "keras==2.14.0",
    "mtcnn==0.1.1",
    "numpy==1.26.1",
    "opencv-python==4.8.1.78",
    "pandas==2.1.2",
    "Pillow==10.1.0",
    "h5py==3.10.0",
    "protobuf==4.24.4",
    "setuptools==81.0.0",
]
notebook = [
    "ipython",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<7",
]
dev = [
    "build>=1,<2",
    "pytest>=8,<9",
    "tomli; python_version < '3.11'",
]

[project.scripts]
pyWitnessAI = "pyWitnessAI.API.cli:main"

[project.urls]
Homepage = "https://github.com/Damien-WangZehou/pyWitnessAI"
Repository = "https://github.com/Damien-WangZehou/pyWitnessAI"
Issues = "https://github.com/Damien-WangZehou/pyWitnessAI/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyWitnessAI*"]
namespaces = false

# Package data declared with paths relative to the package root (not "src/...").
[tool.setuptools.package-data]
pyWitnessAI = [
  "Local_Models/OpenCV_Models/*.xml"
]

[tool.setuptools.exclude-package-data]
pyWitnessAI = ["Local_Models/*.h5"]

# setuptools_scm: derive version from Git; fallback if no tags are available.
[tool.setuptools_scm]
fallback_version = "0.0.1"
write_to = "src/pyWitnessAI/_version.py"

[tool.pytest.ini_options]
testpaths = ["test", "studies/qualtrics_cfd_clip/tests"]
pythonpath = ["src", "."]
