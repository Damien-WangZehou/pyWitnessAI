<!doctype html><html lang="en"><meta charset="utf-8"><title>Local lineup UI fixture</title>
<style>body{font:17px Arial,sans-serif;margin:26px;color:#17212b}main{max-width:900px;margin:auto}.fixture-note{padding:12px;background:#fff2cd}#next{display:none;float:right;font:inherit;padding:14px}pre{white-space:pre-wrap}</style>
<main><p class="fixture-note">UI TEST ONLY: all six slots intentionally reuse the same local photograph. No AI request is made.</p>
<p>If you see the person from the video, select him. If you do not see him, select 'Not Present'.</p>
<div id="QID60"><div class="ChoiceStructure"></div><style>
.ai-lineup-grid[hidden], [data-lineup-retry][hidden], [data-lineup-exit][hidden]{display:none!important}
.ai-lineup-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:780px;margin:16px auto}
.ai-lineup-grid button{border:2px solid #cbd2d9;border-radius:6px;padding:8px;background:white;color:#17212b;cursor:pointer;font:inherit;min-width:0}
.ai-lineup-grid button[aria-checked=true]{border-color:#12683e;box-shadow:0 0 0 2px #12683e}
.ai-lineup-grid button:focus-visible{outline:3px solid #2460a5;outline-offset:3px}
.ai-lineup-member img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#808080;margin-bottom:7px}
.ai-lineup-reject{grid-column:1/-1;padding:14px!important;font-weight:bold!important}
[data-lineup-status]{padding:12px;background:#edf2f7;max-width:780px;margin:auto}
[data-lineup-retry],[data-lineup-exit]{font:inherit;padding:12px;margin:8px;cursor:pointer}
@media(max-width:650px){.ai-lineup-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<p data-lineup-status role="status" aria-live="polite">Preparing your lineup...</p>
<div data-lineup-grid class="ai-lineup-grid" role="radiogroup" aria-label="Lineup identification" hidden></div>
<button type="button" data-lineup-retry hidden>Retry</button>
<button type="button" data-lineup-exit hidden>Technical problem — end the study and receive the completion code</button></div><button id="next">Next &#8594;</button><pre id="result"></pre></main>
<script>
const fields={lineupSeed:'local-ui-fixture',verbalDescription:'A man with short hair.',condition:'mixingFaces',targetLineup:'targetPresent',studyVersion:'ai_generated_lineup_2x2_v1',LINEUP_API_BASE_URL:'https://local-fixture.test'};
const callbacks={load:[],ready:[],submit:[],unload:[]};
const engine={getEmbeddedData:key=>fields[key],setEmbeddedData:(key,value)=>{fields[key]=value;document.getElementById('result').textContent=JSON.stringify({responseType:fields.responseType,targetLineup:fields.targetLineup,condition:fields.condition,SelectedPosition:fields.SelectedPosition,LineupDecisionRTms:fields.LineupDecisionRTms},null,2)}};
for(const [name,key] of [['addOnload','load'],['addOnReady','ready'],['addOnPageSubmit','submit'],['addOnUnload','unload']])engine[name]=fn=>callbacks[key].push(fn);
window.Qualtrics={SurveyEngine:engine};
window.fetch=async()=>({ok:true,status:200,json:async()=>({status:'ready',lineup_id:'fixture',study_version:fields.studyVersion,condition:fields.condition,target_lineup:fields.targetLineup,metadata:{},items:Array.from({length:6},(_,i)=>({position:i+1,image_id:'fixture_'+(i+1),image_url:'/media/fixture/'+(i+1)+'.png',role:i===2?'suspect':'filler'}))})});
window.Image=function(){const img=document.createElement('img');Object.defineProperty(img,'src',{set(value){img.setAttribute('src','../perp_refer_to_AI_generated_image.png')},get(){return img.getAttribute('src')}});return img};
</script><script src="../lineup_client.js"></script><script src="../lineup_question.js"></script>
<script>
const question={hideNextButton(){document.getElementById('next').style.display='none'},showNextButton(){document.getElementById('next').style.display='block'},getQuestionContainer(){return document.getElementById('QID60')},setChoiceValue(choice,value){if(value)this.choice=choice}};
callbacks.load.forEach(fn=>fn.call(question));callbacks.ready.forEach(fn=>fn.call(question));
document.getElementById('next').addEventListener('click',()=>callbacks.submit.forEach(fn=>fn.call(question,'next')));
</script></html>
